[package]
name = "retro-pong-server"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Dedicated server for Retro Pong multiplayer"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "retro-pong-server"
path = "src/main.rs"
